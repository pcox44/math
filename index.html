<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Cox's Math Stuff</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* --------------------------------------------------
       RESET & BASE
    -------------------------------------------------- */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
  background-color: #DCD6FF; /* lavender */
  color: #000;
  line-height: 1.6;
}

    /* --------------------------------------------------
       HEADER
    -------------------------------------------------- */
    header {
      border: 12px solid #000;
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 {
  background-color: #f1f3f5;
  color: #343a40;
}

    /* --------------------------------------------------
       MAIN BOXES
    -------------------------------------------------- */
    .boxes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      padding: 2rem;
      border: 12px solid #000; /* outline around the whole grid */
      margin-bottom: 2rem;
    }

    .box {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      border: 12px solid #000; /* thick black borders */
      transition: transform 0.2s, filter 0.2s;
    }

    /* Primary colors for boxes */
    .box.ab { background-color: #2e7d32; color: #fff; }
    .box.bc { background-color: #0047ab; color: #fff; } /* blue */
    .box.alg2 { background-color: #ff0000; color: #fff; } /* red */
    .box.cool { background-color: #ffd700; color: #000; } /* yellow */
    

    .box:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    /* --------------------------------------------------
       FOOTER
    -------------------------------------------------- */
   footer {
  background-color: #e9ecef; /* light blue */
  color: #343a40; /* darker blue for contrast */
  padding: 2rem 1rem;
  border: 12px solid #000;
  text-align: center;
  font-weight: 700;
  letter-spacing: 1px;
  margin-top: 2rem;
}

    /* --------------------------------------------------
       RESPONSIVE
    -------------------------------------------------- */
    @media (max-width: 768px) {
      .boxes {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 1rem;
      }
    }
  </style>
</head>
<body class="theme-mondrian">

  <header>
    <h1>Mr. Cox's Math Stuff</h1>
  </header>

  <main class="boxes">
    <a href="ab.html" class="box ab">AP Calculus AB</a>
    <a href="bc.html" class="box bc">AP Calculus BC</a>
    <a href="algebra2.html" class="box alg2">Algebra 2</a>
    <a href="cool.html" class="box cool">Cool Math Stuff</a>
  </main>

  <footer>
    &copy; 2025-2026 Mr. Cox
  </footer>

</body>
</html>
